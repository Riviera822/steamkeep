# SteamHangar vault-core -- WP 3.10 (ADR-0008) "feature off" fixture.
#
# A minimal, standalone nginx config (NOT a copy of core/nginx/nginx.conf --
# same "local throwaway rig" pattern as fixtures/retry-regression.conf) used
# by core/tests/test-core.ps1's cache-event-log test group to prove two
# things empirically, independent of the real Steam CDN:
#
#   1. A config with NO "access_log ... vault_event ..." directive at all
#      (exactly what core/docker/25-vault-eventlog.sh produces when
#      VAULT_EVENT_LOG is empty/unset -- see core/README.md "Cache-event
#      log") still passes `nginx -t` cleanly.
#   2. Serving real requests through that config creates no "event.log"
#      file anywhere -- absence of the directive means absence of the
#      feature, not a feature that silently no-ops into an empty file.
#
# Run standalone: <nginx.exe> -p <this rig root> -c <this file>
# Listens on 18103 (distinct from both port 80 and the retry-rig's 18096)
# to avoid clashing with any other instance a parallel test run might have
# left behind.

worker_processes  1;

pid        logs/nginx.pid;
error_log  logs/error.log warn;

events {
    worker_connections  16;
}

http {
    default_type  application/octet-stream;
    sendfile      on;

    client_body_temp_path tmp/client_body;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;
    # nginx initializes ALL standard temp paths at startup regardless of
    # whether the corresponding module is exercised by this config (same
    # note as core/nginx/nginx.conf) -- omitting this one made `nginx -t`
    # fail trying to CreateDirectory() the default "temp/proxy_temp" (found
    # empirically running this fixture for the first time), even though
    # this fixture never calls proxy_pass.
    proxy_temp_path       tmp/proxy;

    access_log  logs/access.log;

    server {
        listen       18103;
        root cache;

        location / {
            # Deliberately NO "access_log ... vault_event ..." directive
            # here -- this IS the "feature off" state under test.
            return 200 "ok\n";
        }
    }
}
