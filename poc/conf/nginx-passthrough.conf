# SteamVault Phase 0 PoC — WP 0.5 variant: transparent passthrough on miss.
#
# This is NOT a replacement for conf/nginx.conf (the WP 0.1 "store" baseline,
# which stays frozen and under test). It is the forward-looking variant that
# measures the plan's prefill-first hypothesis (docs/PROJECT_PLAN.md section 5,
# "Slow cache-miss downloads" row): on a cache MISS, does the client fare
# better if nginx just forwards upstream bytes untouched (no proxy_store, no
# disk write), leaving the cache to be filled later by an async prefill job,
# instead of synchronously fetching-and-storing on the client's critical path?
#
# Same log format and directory layout as nginx.conf so the two configs'
# access.log output is directly comparable by poc/test-misshandling.ps1.
#
# Run with:  nginx.exe -p <repo>/poc -c conf/nginx-passthrough.conf
# (or:  .\start.ps1 -Config nginx-passthrough.conf)
#
# --- What's different from nginx.conf, and why -----------------------------
#
# 1. HIT path is UNCHANGED: `try_files $uri @miss;` still serves straight
#    from disk first. This matters even in passthrough mode, because an
#    async prefill job (or a file copied in out-of-band) can populate
#    cache/depot/... independently of client traffic — a client request for
#    an object a prefill already finished should still be a HIT, not
#    re-fetched from upstream. Passthrough only changes what happens on a
#    genuine MISS; it does not turn this into a no-cache proxy.
#
# 2. MISS path has NO `proxy_store`. The @miss location just proxies the
#    request through and returns whatever upstream sends — nothing is
#    written to disk. Filling the cache for that object is left entirely to
#    an out-of-band prefill (SteamPrefill run, WP 0.4), not to client
#    traffic hitting this location.
#
# 3. The client's `Range` header is forwarded upstream AS-IS, and nothing
#    here strips or rewrites it. This is deliberate, not an oversight:
#      - In passthrough mode nginx never stores the response, so there is no
#        "torn write" or "partial file masquerading as complete" risk (the
#        exact risk documented in PROJECT_PLAN.md section 9 and evidenced in
#        RANGE-FINDINGS.md) — nothing lands on disk either way, so a Range
#        response reaching the client (206, partial bytes, whatever upstream
#        chooses to do with the header) is simply correct passthrough
#        behavior. The client asked for a range; it should get exactly what
#        the real Steam CDN would have given it directly. Stripping/altering
#        the header here would be an unnecessary behavior change with no
#        safety benefit.
#      - CONTRAST with store-mode (nginx.conf's @miss location): there,
#        `proxy_store` writes whatever upstream returns to the object's
#        *full, canonical* on-disk path, without regard for the `Range`
#        header the client sent. RANGE-FINDINGS.md documents that today's
#        tested upstream edge happens to always ignore Range and return 200
#        with the full body — but that's an upstream behavior, not a
#        guarantee this config enforces. If some Steam CDN edge/route ever
#        *does* honor Range on a cold object, store-mode would silently
#        write a truncated partial response to the object's full-object
#        path and later serve it as if complete. Production store-mode
#        (Phase 1) therefore needs an explicit guard nginx.conf does not yet
#        have: strip the client's Range header before proxying to upstream
#        on a MISS (e.g. `proxy_set_header Range "";` in @miss) AND only
#        `proxy_store` a response when `$upstream_status = 200` (never
#        store a 206/partial body under the full-object path). Passthrough
#        mode needs neither guard, because it never writes to disk.
#
# Everything else (worker/events tuning, temp paths, resolver, upstream
# choice, log format, /health) is copied unchanged from nginx.conf so the
# two configs are comparable apples-to-apples in poc/test-misshandling.ps1.
# See nginx.conf's own header comment for the upstream/loop-risk rationale
# (dist-fra1.discovery.steamserver.net instead of anything in the
# steamcontent.com family, plus the explicit `resolver` directive) — it
# applies identically here and is not repeated in full.

worker_processes  1;

pid        logs/nginx.pid;
error_log  logs/error.log warn;

events {
    worker_connections  256;
}

http {
    default_type  application/octet-stream;
    sendfile      on;

    # See nginx.conf: nginx initializes these temp paths at startup
    # regardless of whether this config's modules use them.
    client_body_temp_path cache/tmp/client_body;
    fastcgi_temp_path cache/tmp/fastcgi;
    uwsgi_temp_path   cache/tmp/uwsgi;
    scgi_temp_path    cache/tmp/scgi;

    # Resolve the upstream ourselves; do not trust/depend on the OS resolver
    # or hosts file (see nginx.conf's loop-risk note).
    resolver 1.1.1.1 ipv6=off valid=300s;

    # "-" for upstream_status on locally-served cache hits (no upstream was
    # contacted), the real code otherwise.
    map $upstream_status $vault_upstream_status {
        ""      "-";
        default $upstream_status;
    }

    # Identical log format to nginx.conf on purpose — this is what makes the
    # two configs' access.log output directly comparable.
    log_format vault
        '$time_local uri="$request_uri" status=$status '
        'range="$http_range" upstream_status=$vault_upstream_status '
        'bytes_sent=$bytes_sent request_time=$request_time '
        'cache=$vault_cache_status';

    access_log  logs/access.log  vault;

    server {
        listen       80;
        server_name  localhost;

        # Cache root: request URI /depot/<id>/chunk/<hash> maps 1:1 onto
        # cache/depot/<id>/chunk/<hash> on disk — same path-faithful layout
        # as nginx.conf, so a prefill job (or the store-mode config, run
        # earlier) that already populated this tree is served as a HIT here
        # too, unchanged.
        root cache;

        proxy_temp_path cache/tmp/proxy;

        set $vault_cache_status "-";

        location /depot/ {
            set $vault_cache_status HIT;
            # Already-cached objects (filled by prefill, or left over from
            # store-mode testing) still serve straight from disk. Only a
            # genuine miss falls through to @miss below.
            try_files $uri @miss;
        }

        location @miss {
            set $vault_cache_status MISS;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host dist-fra1.discovery.steamserver.net;

            # Client's Range header (if any) is forwarded upstream
            # unmodified — see rationale point 3 above. Nothing is stored,
            # so honoring the client's Range 1:1 is simply correct
            # passthrough behavior, not a risk.
            proxy_pass http://dist-fra1.discovery.steamserver.net$request_uri;

            # Deliberately NO proxy_store here. This is the entire point of
            # this config: a miss is served straight through to the client
            # and NOTHING is written to cache/depot/... The cache only gets
            # filled by an out-of-band prefill process (WP 0.4), never by
            # client-triggered traffic.
        }

        location = /health {
            return 200 "ok\n";
        }

        # Real LanCache-client compatibility contract (confirmed via
        # SteamPrefill's own LancacheIpResolver.cs, WP 0.4): clients that
        # auto-detect a cache probe GET /lancache-heartbeat and require an
        # X-LanCache-Processed-By response header before trusting an IP as
        # a real cache. REQUIRED for SteamPrefill/any LanCache-aware client
        # to auto-detect this server, and for the eventual production
        # vault-core config (docs/PROJECT_PLAN.md section 3) — do not drop
        # this when nginx-passthrough.conf's approach is superseded by the
        # real vault-core config.
        location = /lancache-heartbeat {
            add_header X-LanCache-Processed-By "steamvault-poc";
            return 200;
        }
    }
}
