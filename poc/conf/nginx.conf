# SteamVault Phase 0 PoC — purpose-built nginx config (NOT a LanCache fork).
#
# Goal: prove that `proxy_store` can cache Steam CDN depot chunks/manifests
# path-faithfully on disk, and serve repeat requests straight from disk
# without contacting the upstream again.
#
# Run with:  nginx.exe -p <repo>/poc -c conf/nginx.conf
# All relative paths below (root, access_log, proxy_temp_path, pid) are
# resolved relative to the -p prefix directory (poc/), which is what makes
# this config portable across machines/checkouts instead of hardcoding an
# absolute path.
#
# --- Upstream / loop-risk note ----------------------------------------------
# WP 0.3 (real Steam client test) will add a Windows hosts-file entry:
#   lancache.steamcontent.com -> 127.0.0.1
# nginx running on the same machine resolves hostnames through the very same
# hosts file (on Windows, name resolution libraries consulted by nginx's
# resolver fall back to/consult the hosts file for plain getaddrinfo-style
# lookups issued at *startup*, and more importantly any hostname we might
# reuse in proxy_pass could collide with future hosts-file entries added for
# other test phases). To make the loop-safety guarantee robust and not
# dependent on "we happen to not add that entry yet", this config:
#   1. Never proxies to `lancache.steamcontent.com` or any `*.steamcontent.com`
#      name (the exact family of names the PC-agent hosts-file mode, per
#      docs/PROJECT_PLAN.md section on vault-agent, is documented to rewrite).
#   2. Proxies instead to `dist-fra1.discovery.steamserver.net` — a concrete,
#      real Valve CDN edge hostname (confirmed reachable and serving real
#      depot chunk data during this PoC's build) that is NOT part of the
#      steamcontent.com family and therefore will never be shadowed by the
#      hosts-file entries used in later work packages.
#   3. Uses an explicit `resolver` directive (Cloudflare public DNS, 1.1.1.1)
#      so nginx resolves the upstream itself over the network instead of
#      relying on the OS resolver/hosts file at all. This is defense in depth:
#      even if a future hosts entry existed for our chosen upstream name,
#      nginx would not honor it.
# If this upstream hostname ever stops resolving/serving, swap it for another
# `*.discovery.steamserver.net` edge (see nslookup lancache.steamcontent.com
# for current CNAME targets) — just keep it outside the steamcontent.com zone.

worker_processes  1;

pid        logs/nginx.pid;
error_log  logs/error.log warn;

events {
    worker_connections  256;
}

http {
    default_type  application/octet-stream;
    sendfile      on;

    # This PoC only ever does GET (no client request bodies), but nginx
    # still initializes the client-body temp path at startup, so it must
    # exist under the prefix. Point it (and nothing else) at cache/tmp.
    client_body_temp_path cache/tmp/client_body;
    # nginx initializes all of these standard temp paths at startup
    # regardless of whether the corresponding module is actually used in
    # this config, so they all need to point somewhere that exists.
    fastcgi_temp_path cache/tmp/fastcgi;
    uwsgi_temp_path   cache/tmp/uwsgi;
    scgi_temp_path    cache/tmp/scgi;

    # Resolve the upstream ourselves; do not trust/depend on the OS resolver
    # or hosts file (see loop-risk note above).
    resolver 1.1.1.1 ipv6=off valid=300s;

    # "-" for upstream_status on locally-served cache hits (no upstream was
    # contacted), the real code otherwise.
    map $upstream_status $vault_upstream_status {
        ""      "-";
        default $upstream_status;
    }

    # Custom access log: answers the Phase-0 questions per request —
    # was it a hit or miss, what was the range header, how big/fast was it.
    log_format vault
        '$time_local uri="$request_uri" status=$status '
        'range="$http_range" upstream_status=$vault_upstream_status '
        'bytes_sent=$bytes_sent request_time=$request_time '
        'cache=$vault_cache_status';

    access_log  logs/access.log  vault;

    server {
        listen       80;
        server_name  localhost;

        # Cache root: request URI /depot/<id>/chunk/<hash> maps 1:1 onto
        # cache/depot/<id>/chunk/<hash> on disk (path-faithful storage).
        root cache;

        # Applies to the whole server block (nginx initializes this temp
        # path at startup regardless of which location ends up using it).
        proxy_temp_path cache/tmp/proxy;

        # Default marker for anything outside /depot/ (not expected in this
        # PoC, but keeps the log format well-defined).
        set $vault_cache_status "-";

        location /depot/ {
            set $vault_cache_status HIT;
            # Serve straight from disk if we already stored this file;
            # otherwise fall through to the upstream-fetching location.
            try_files $uri @miss;
        }

        location @miss {
            set $vault_cache_status MISS;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host dist-fra1.discovery.steamserver.net;

            proxy_pass http://dist-fra1.discovery.steamserver.net$request_uri;

            # Store the response path-faithfully under cache/ (same mapping
            # as the `root` above), so hit and miss use the exact same path.
            proxy_store        on;
            proxy_store_access user:rw group:r all:r;
        }

        location = /health {
            return 200 "ok\n";
        }
    }
}
