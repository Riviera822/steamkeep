name: Feature request
description: Propose a new capability or a change to existing behavior.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: skim `docs/PROJECT_PLAN.md` (especially the phase plan
        and "Risks & Open Questions") — your idea may already be planned, or
        may touch a decision recorded in `docs/adr/` that would need a new
        ADR to change, in which case say so and this issue becomes that
        discussion.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: >
        What's the actual problem or friction? Describe the situation, not
        the solution yet — e.g. "I can't tell which client is bypassing the
        cache" rather than "add a dashboard."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see happen, as concretely as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other ways to solve the same problem, including "do nothing" if
        relevant, and why you didn't prefer them.
    validations:
      required: false

  - type: dropdown
    id: willing_to_pr
    attributes:
      label: Would you be willing to open a PR for this?
      options:
        - "Yes"
        - "Yes, with some guidance"
        - "No, just proposing the idea"
    validations:
      required: true
