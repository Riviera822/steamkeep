# SteamVault -- Docker Compose deployment (Phase 1, WP 1.9).
#
#   cd deploy
#   cp .env.example .env      # then set VAULT_API_KEY
#   docker compose up -d
#
# Everything configurable lives in deploy/.env (Compose reads it automatically
# from this directory). NO SECRETS IN THIS FILE -- VAULT_API_KEY is referenced,
# never defaulted: `${VAULT_API_KEY:?...}` makes Compose refuse to run at all if
# it is unset or empty, which is the intended behaviour for the one value that
# guards every non-health endpoint.
#
# Full walkthrough, including the one-time interactive SteamPrefill login and the
# port-80 / dedicated-IP story: deploy/README.md.

name: steamvault

# --- Log rotation ------------------------------------------------------------
# Applied to every service below. This is what closes core/README.md's open "log
# rotation" caveat from WP 1.1: all three containers log to stdout/stderr, and
# the json-file driver caps what that costs on disk -- 10 MB per file, 5 files,
# so at most ~50 MB per service, ~150 MB total, enforced by the daemon with no
# logrotate, no cron and no SIGUSR1 reopen dance. Raise VAULT_LOG_MAX_SIZE /
# VAULT_LOG_MAX_FILE in .env if you want longer history (vault-core logs one line
# per depot request, so a busy prefill can churn through 10 MB quickly).
x-vault-logging: &vault-logging
  driver: json-file
  options:
    max-size: "${VAULT_LOG_MAX_SIZE:-10m}"
    max-file: "${VAULT_LOG_MAX_FILE:-5}"

services:

  # ===========================================================================
  # vault-core -- the cache. Plain HTTP on port 80, LAN only.
  # ===========================================================================
  vault-core:
    build:
      context: ../core
      dockerfile: Dockerfile
    image: steamvault/vault-core:${VAULT_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      # Upstream DNS resolver nginx uses to resolve Steam CDN hostnames at
      # request time (ADR-0001 req 4). MUST NOT point at vault-dns: vault-dns
      # answers *.steamcontent.com with vault-core's own address, which would
      # make every cache miss proxy back into this container forever.
      VAULT_RESOLVER: ${VAULT_RESOLVER:-1.1.1.1}
      # Optional cache-event log (WP 3.10, ADR-0008; core/README.md
      # "Cache-event log"). Empty (the default from core/Dockerfile) means
      # OFF: core/docker/25-vault-eventlog.sh strips the access_log
      # directives entirely, so nothing is created or written. Same
      # default-empty passthrough pattern as CACHE_IP below for vault-dns.
      # The consumer is WP 3.11's sweeper (miss-triggered prefill
      # completion, per-client hit stats, bypass detection -- requirement
      # A12): vault-api's matching VAULT_EVENT_LOG_PATH is set a few lines
      # down. .env.example ships both uncommented as of the 2026-08-17
      # packaging work package -- see it before turning this back off. When
      # set, it must be a path under /vault/; see the volume note on
      # vault-api's /vault mount below for why no extra mount is needed here
      # for vault-api to read it later.
      VAULT_EVENT_LOG: ${VAULT_EVENT_LOG:-}
    ports:
      # PORT 80 IS NOT NEGOTIABLE FOR REAL CLIENTS. Steam CDN traffic is plain
      # HTTP and the Steam client will only ever ask for port 80 -- a cache on
      # another port simply never gets used (docs/PROJECT_PLAN.md §10).
      #
      # If something else on this host already owns port 80, do NOT move
      # SteamVault to another port -- give it its own address instead (§10):
      #   * an IP alias on the existing NIC:
      #       ip addr add 192.168.1.50/24 dev eth0
      #       VAULT_CORE_BIND=192.168.1.50   in .env
      #   * or a macvlan / dedicated VLAN interface for the container.
      # Then point your DNS rewrite (or vault-dns's CACHE_IP) at that address.
      #
      # Default 0.0.0.0 is deliberate and correct HERE and only here: every LAN
      # client must be able to reach the cache. It is still a LAN-only service --
      # never port-forward it, never put it behind a public reverse proxy
      # (§10: "never expose vault-core/port 80"). It has no authentication, by
      # design: the Steam client cannot present any.
      - "${VAULT_CORE_BIND:-0.0.0.0}:${VAULT_CORE_PORT:-80}:80"
    volumes:
      # ONE volume, mounted at /vault, containing BOTH cache/ and tmp/.
      # This is a correctness requirement, not tidiness: proxy_store completes
      # every cached object by rename()-ing it out of tmp/ into cache/depot/...,
      # which is atomic only within a single filesystem (core/README.md
      # "Same-filesystem requirement"). Do not split these into two mounts --
      # the container's preflight compares st_dev and refuses to start if you do.
      #
      # VAULT_CACHE_PATH (deploy/.env, empty by default) is the dedicated-cache-
      # mount knob: leave it unset and this resolves to the plain string
      # "vault-cache", i.e. the Docker-managed named volume declared under
      # `volumes:` below -- byte-for-byte what this line always was, so a
      # deployment that never touches VAULT_CACHE_PATH sees ZERO behaviour
      # change. Set it to an ABSOLUTE host path (e.g. a ZFS dataset mount point)
      # and Compose's short-syntax volume source disambiguates on the leading
      # "/": the same string now bind-mounts that host directory at /vault
      # instead -- cache/ AND tmp/ move together as one unit, because it is the
      # single /vault mount point that is being redirected, not a sub-path
      # underneath it. This is deliberate: the same-filesystem constraint above
      # is only satisfiable by moving both at once, never one at a time.
      # vault-api mounts the identical expression a few lines down -- both
      # services must resolve to the SAME location, named-volume or bind-mount.
      # See deploy/README.md "Using a dedicated cache mount" for the required
      # host-side `mkdir` + `chown 101:101` before first start.
      - ${VAULT_CACHE_PATH:-vault-cache}:/vault
    security_opt:
      # nginx's master drops privileges to uid 101 for its workers; nothing here
      # ever needs to gain privileges via a setuid binary.
      - no-new-privileges:true
    logging: *vault-logging

  # ===========================================================================
  # vault-api -- control plane + SteamPrefill host. API-key authenticated.
  # ===========================================================================
  vault-api:
    build:
      # Repo ROOT, not ../api (packaging work package, docs/PROJECT_PLAN.md
      # §7 Phase 5, 2026-08-17: user decision -- bake the web UI into the
      # image rather than a mount-only fix, because a mount-only fix cannot
      # survive `docker pull` of a published image, WP 5.5). api/Dockerfile
      # now COPYs web/ in too, and web/ is a repo-root SIBLING of api/, not a
      # child of it -- an api/-only context could never reach it. The root
      # .dockerignore keeps this wider context from also sending app/ (the
      # Android tree), poc/ (Phase-0 evidence) and every other component's
      # own directory to the daemon on every build -- measured 9.734 MB ->
      # 1.54 MB (84% smaller) on the checkout this was built against
      # (.dockerignore has the "Sending build context" numbers). vault-core
      # and vault-dns below are UNCHANGED: each keeps its own directory as
      # build context, unaffected by this.
      context: ..
      dockerfile: api/Dockerfile
    image: steamvault/vault-api:${VAULT_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      # Required. No default anywhere in the stack: Compose refuses to start
      # without it, and vault-api itself refuses to boot without it.
      VAULT_API_KEY: ${VAULT_API_KEY:?set VAULT_API_KEY in deploy/.env (see .env.example)}
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL:-INFO}
      VAULT_PREFILL_TIMEOUT_SECONDS: ${VAULT_PREFILL_TIMEOUT_SECONDS:-14400}
      VAULT_WORKER_POLL_SECONDS: ${VAULT_WORKER_POLL_SECONDS:-1.0}
      VAULT_SIZE_CACHE_TTL: ${VAULT_SIZE_CACHE_TTL:-60.0}
      VAULT_AGENT_REPORT_KEEP: ${VAULT_AGENT_REPORT_KEEP:-20}
      # Manifest-based GC (WP 3.8b/3.12, api/README.md "The recently-stored
      # grace window" / "Auto-GC"). Defaults match vault-api's own built-in
      # defaults byte-for-byte, so a deployment that never touches either
      # variable in .env sees identical behaviour to today.
      VAULT_GC_GRACE_DAYS: ${VAULT_GC_GRACE_DAYS:-14}
      VAULT_AUTO_GC: ${VAULT_AUTO_GC:-off}
      # How many archived manifest .bin files prune_archive keeps PER DEPOT
      # (WP 3.2, api/README.md "Manifest archive"). Default matches
      # config.py's own built-in default byte-for-byte.
      VAULT_MANIFEST_KEEP: ${VAULT_MANIFEST_KEEP:-3}
      # vault-api's READ side of the cache-event log vault-core writes via
      # VAULT_EVENT_LOG above (WP 3.10/3.11, ADR-0008; packaging WP gap
      # closed 2026-08-17 -- this key existed in config.py since WP 3.11 but
      # was never forwarded here, so the miss-triggered prefill completion,
      # per-client hit stats and bypass detection it drives (requirement
      # A12) were unreachable in the shipped stack; see LEARNINGS.md
      # "Containers" for the general shape of this class of bug). Empty
      # (default) keeps the sweeper off even if VAULT_EVENT_LOG is set on
      # vault-core -- both variables must name the SAME path under the
      # shared /vault volume both services already mount, see .env.example.
      VAULT_EVENT_LOG_PATH: ${VAULT_EVENT_LOG_PATH:-}
      # The rest of the WP 3.11 event-sweep tuning knobs -- same audit finding
      # as VAULT_EVENT_LOG_PATH above (present in config.py, never forwarded
      # here before the packaging WP's B1 fix-round). Defaults match
      # config.py's own built-in defaults byte-for-byte; see .env.example for
      # what each one actually does.
      VAULT_EVENT_SWEEP_INTERVAL_MINUTES: ${VAULT_EVENT_SWEEP_INTERVAL_MINUTES:-5}
      VAULT_MISS_TRIGGER_COOLDOWN_MINUTES: ${VAULT_MISS_TRIGGER_COOLDOWN_MINUTES:-60}
      VAULT_MISS_TRIGGER_MAX_PER_SWEEP: ${VAULT_MISS_TRIGGER_MAX_PER_SWEEP:-5}
      VAULT_BYPASS_WINDOW_DAYS: ${VAULT_BYPASS_WINDOW_DAYS:-3}
      VAULT_CLIENT_STATS_KEEP: ${VAULT_CLIENT_STATS_KEEP:-48}
      # Truncate the event log past this size (api/README.md "Rotation --
      # best-effort..."). Reachable now for the specific reason that section
      # documents: in the SHIPPED containers vault-api cannot truncate at all
      # (PermissionError, /vault/logs is vault-core's), so every sweep past
      # this size warns and increments truncate_denied_count forever --
      # setting this to 0 (disables truncation attempts entirely) is the
      # documented way to silence that without lying about rotation actually
      # happening. Default matches config.py's own built-in default
      # byte-for-byte (64 MiB).
      VAULT_EVENT_LOG_MAX_BYTES: ${VAULT_EVENT_LOG_MAX_BYTES:-67108864}
      # Opt-in manifest oracle (WP 3.9, ADR-0007 addendum B). Empty/off by
      # default -- see .env.example for the privacy note (queries leave the
      # LAN) before setting this. Same forwarding gap as above until the
      # packaging WP: present in config.py, never wired through here.
      VAULT_MANIFEST_ORACLE: ${VAULT_MANIFEST_ORACLE:-}
      # The oracle's URL and per-request timeout -- forwarding these is NOT
      # optional once VAULT_MANIFEST_ORACLE is on: .env.example's privacy note
      # tells operators to point VAULT_MANIFEST_ORACLE_URL at their own
      # private mirror/proxy instead of the public default, and that advice
      # is a no-op without this line (B1 reviewer finding -- the exact
      # "advertised but unreachable" bug this audit exists to close).
      # Defaults match config.py's own built-in defaults byte-for-byte.
      VAULT_MANIFEST_ORACLE_URL: ${VAULT_MANIFEST_ORACLE_URL:-https://api.steamcmd.net/v1/info}
      VAULT_MANIFEST_ORACLE_TIMEOUT: ${VAULT_MANIFEST_ORACLE_TIMEOUT:-10.0}
      # Per-attempt delivery timeout for the webhook feature (WP 3.13). Unlike
      # VAULT_WEBHOOK_URL/VAULT_WEBHOOK_EVENTS (DB-overridable at runtime via
      # PATCH /v1/settings, ADR-0009 -- see settings_store.OVERRIDABLE_SPECS),
      # this one has no DB-backed path, so env forwarding is the ONLY way to
      # reach it. Default matches config.py's own built-in default
      # byte-for-byte.
      VAULT_WEBHOOK_TIMEOUT_SECONDS: ${VAULT_WEBHOOK_TIMEOUT_SECONDS:-5.0}
      # WP 4h.0 (ADR-0010): the privacy gate for the Steam relay's
      # playtime_forever / rtime_last_played fields (api/README.md "Steam
      # Web API relay"). Env-only, on purpose and UNLIKE VAULT_AUTO_GC/
      # VAULT_SWEEP_INCLUDE_CACHED above (which ARE DB-overridable): the
      # settings table lives in the vault-db volume below, and a setting
      # whose only failure mode is "silently resumes collecting personal
      # data after the volume is lost" cannot be backed by that volume
      # (docs/adr/0010-*.md has the full argument). Forwarded HERE, not left
      # to a compose.override.yaml recipe, because this project has three
      # times now shipped a README sentence telling an operator to set a
      # variable that the stack never actually forwarded
      # (docs/LEARNINGS.md "Containers") -- see
      # tests/test_p1_compose_env_defaults.py, which fails if either line
      # below is ever removed. Off by default (config.py's
      # DEFAULT_RELAY_EXPOSE_PLAYTIME/_LAST_PLAYED) -- turning either on
      # requires editing this file (or deploy/.env) and restarting the
      # container; there is no runtime switch.
      VAULT_RELAY_EXPOSE_PLAYTIME: ${VAULT_RELAY_EXPOSE_PLAYTIME:-false}
      VAULT_RELAY_EXPOSE_LAST_PLAYED: ${VAULT_RELAY_EXPOSE_LAST_PLAYED:-false}
      # VAULT_DB_PATH, VAULT_CACHE_ROOT, VAULT_STEAMPREFILL_PATH and
      # VAULT_WEB_DIR are baked into the image (they describe the image's own
      # layout, not a deployment choice) -- see api/Dockerfile. VAULT_NAME,
      # VAULT_SCHEDULE_WINDOW, VAULT_SCHEDULE_INTERVAL_MINUTES,
      # VAULT_SCHEDULE_CLIENT_STALE_DAYS, VAULT_WEBHOOK_URL and
      # VAULT_WEBHOOK_EVENTS are deliberately NOT forwarded here either, but
      # for a different reason: they are DB-overridable at runtime via
      # PATCH /v1/settings (ADR-0009) once the stack is up, which is the
      # supported way to set them -- see api/README.md "Settings" and the
      # web UI / app settings screens. VAULT_SETTINGS_READONLY is
      # deliberately env-only BY DEFINITION (a settings-API lock cannot be
      # unlockable through that same API) -- like VAULT_RELAY_EXPOSE_PLAYTIME/
      # _LAST_PLAYED above it has no DB-override counterpart at all, but
      # (unlike those two) it is NOT forwarded here today, out of scope for
      # this work package to change.
      # VAULT_MANIFEST_ARCHIVE_DIR and VAULT_STEAMPREFILL_CACHE_DIR are
      # genuine path overrides tied to volume layout, not general-purpose
      # tuning knobs -- left env-only and documented via the
      # compose.override.yaml recipe in deploy/examples/tuned-setup.md
      # rather than a bare .env line, because a wrong value here silently
      # loses persistence with no volume backing it, unlike the numeric
      # knobs above where a wrong value at worst picks a different (still
      # valid) number.
    ports:
      # LAN-only, like everything else here. This is the interface the Android
      # app and vault-agent talk to. For access from outside the LAN do NOT
      # port-forward this: put it on Tailscale/Twingate, or behind your own
      # TLS reverse proxy with forward-auth on top of the API key
      # (docs/PROJECT_PLAN.md §10 "Remote access").
      - "${VAULT_API_BIND:-0.0.0.0}:${VAULT_API_PORT:-8080}:8080"
    volumes:
      # The same cache volume vault-core writes: vault-api reads it for per-game
      # sizes and deletes depot directories from it. Both containers use uid 101
      # so this works without loosening permissions.
      #
      # Same VAULT_CACHE_PATH expression as vault-core above -- see the comment
      # there. Both services must agree on named-volume vs. bind-mount and on the
      # exact path; this line is kept textually identical to vault-core's on
      # purpose.
      #
      # This is ALSO where the cache-event log lives when VAULT_EVENT_LOG is
      # set on vault-core above: core/Dockerfile pre-creates /vault/logs/
      # inside this same one volume, next to cache/ and tmp/. Because this
      # line already mounts the identical /vault volume into vault-api, no
      # additional volume or mount is needed for vault-api to read
      # /vault/logs/event.log -- WP 3.11's sweeper (this service's
      # VAULT_EVENT_LOG_PATH env var above) reads it straight off this same
      # mount. Deliberately not narrowed to a read-only logs/-only bind
      # here: WP 3.11 owns the cursor/truncation contract (core/README.md
      # "Rotation and the USR1 contract") and decided its own access shape
      # (read, never truncate) rather than one imposed by the mount.
      - ${VAULT_CACHE_PATH:-vault-cache}:/vault
      # SQLite database (mapping, jobs, agent reports). Small; back this up.
      - vault-db:/data
      # SteamPrefill's Config/ -- the Steam SESSION lives here after the one-time
      # interactive login (deploy/README.md "First run"). Treat it as sensitive:
      # it is a logged-in Steam session. vault-api itself never sees credentials
      # (ADR-0004).
      - vault-steamprefill:/opt/steamprefill/Config
      # HOME for the container user. NOT optional plumbing: SteamPrefill's
      # AppConfig static constructor creates a directory under HOME before it
      # parses a single argument, so an unwritable HOME kills every SteamPrefill
      # invocation with a TypeInitializationException (WP 1.9 review blocker,
      # see api/Dockerfile). Volume-backed so the manifest cache it builds there
      # survives restarts instead of being rebuilt into the container layer.
      - vault-steamprefill-home:/opt/steamprefill/home
    security_opt:
      - no-new-privileges:true
    cap_drop:
      # Runs as uid 101 on an unprivileged port and touches nothing but its own
      # volumes -- it needs no Linux capabilities at all.
      - ALL
    logging: *vault-logging

  # ===========================================================================
  # vault-dns -- OPTIONAL. Only for LANs with no existing DNS server.
  #   docker compose --profile dns up -d
  # If you already run AdGuard Home / Pi-hole / dnsmasq / Unbound, use that
  # instead (dns/README.md, "When NOT to use vault-dns") -- one less container
  # and no second thing fighting over port 53.
  # ===========================================================================
  vault-dns:
    profiles: ["dns"]
    build:
      context: ../dns
      dockerfile: Dockerfile
    image: steamvault/vault-dns:${VAULT_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      # REQUIRED when this profile is enabled: the LAN IPv4 address of the host
      # running vault-core. No default -- the entrypoint fails fast with an
      # explanation if it is empty. (It is not written as `${CACHE_IP:?...}`
      # because Compose interpolates this whole file for EVERY command, which
      # would make a plain `docker compose up` fail for people who never enable
      # this profile.)
      CACHE_IP: ${CACHE_IP:-}
      UPSTREAM_DNS_1: ${UPSTREAM_DNS_1:-1.1.1.1}
      UPSTREAM_DNS_2: ${UPSTREAM_DNS_2:-8.8.8.8}
    ports:
      # *** OPEN-RESOLVER WARNING -- THE MOST DANGEROUS TWO LINES IN THIS FILE ***
      # vault-dns forwards arbitrary queries upstream and has NO source-address
      # ACL (dns/README.md "Exposure"). Published on a WAN-reachable interface it
      # is an open recursive resolver: a DNS amplification/reflection weapon
      # aimed at third parties, using your bandwidth and your IP's reputation.
      #
      # Publish it on ONE specific LAN address. In production that looks like:
      #
      #     - "192.168.1.50:53:53/udp"
      #     - "192.168.1.50:53:53/tcp"
      #
      # NEVER like this:
      #
      #     - "53:53/udp"            # <-- Docker binds 0.0.0.0: EVERY interface,
      #     - "53:53/tcp"            #     including any WAN-facing one.
      #
      # Set VAULT_DNS_BIND=<your LAN IP> in .env to get the safe form above.
      # The 127.0.0.1 fallback below is intentional: if the variable is unset or
      # empty this fails CLOSED (no client can reach it, you notice immediately)
      # rather than silently publishing to the world.
      - "${VAULT_DNS_BIND:-127.0.0.1}:${VAULT_DNS_PORT:-53}:53/udp"
      - "${VAULT_DNS_BIND:-127.0.0.1}:${VAULT_DNS_PORT:-53}:53/tcp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # dnsmasq binds the privileged port 53 and then drops to the unprivileged
      # 'dnsmasq' account; that is the complete list of what it needs. It is
      # explicitly NOT granted NET_ADMIN (DHCP server duties) -- vault-dns does
      # DNS only.
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    logging: *vault-logging

volumes:
  # This entry stays declared even when VAULT_CACHE_PATH is set: it is what the
  # "${VAULT_CACHE_PATH:-vault-cache}:/vault" mount lines above fall back to by
  # name when the variable is empty. Named volumes (not bind mounts) are the
  # default because Docker creates them with the right ownership for uid 101
  # automatically (the image seeds a fresh one -- see core/Dockerfile). To put
  # the cache on a specific disk (e.g. a dedicated ZFS dataset), set
  # VAULT_CACHE_PATH to that ABSOLUTE host path in deploy/.env instead of
  # editing this file -- see deploy/README.md "Using a dedicated cache mount":
  # you must mkdir + chown the host directory to 101:101 yourself first, and it
  # always covers cache/ AND tmp/ together (one mount point, never split).
  vault-cache:
  vault-db:
  vault-steamprefill:
  vault-steamprefill-home:
